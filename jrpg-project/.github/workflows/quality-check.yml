name: quality-check
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validasi proyek
        run: node tools/validate-project.mjs
      - name: Tes unit (dijalankan bila skrip test sudah ada, mulai Batch 1)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test?0:1)"; then npm test; else echo "Belum ada skrip test (Batch 1). Tes TIDAK dijalankan."; fi
