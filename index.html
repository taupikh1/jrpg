<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17111d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlas Stars">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <title>The Atlas of Unremembered Stars</title>
  <style>
    :root {
      color-scheme: dark;
      --tc-size: clamp(44px, 11vmin, 50px);
      --tc-gap: clamp(2px, 0.8vmin, 4px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #0d0a10;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }
    #game-canvas {
      display: block;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #touch-controls {
      position: fixed;
      inset: auto;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      font-family: system-ui, sans-serif;
    }
    #touch-controls .tc-dpad {
      position: absolute;
      left: max(8px, env(safe-area-inset-left));
      bottom: max(8px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(3, var(--tc-size));
      grid-template-rows: repeat(3, var(--tc-size));
      gap: var(--tc-gap);
    }
    #touch-controls .tc-dpad .tc-btn { width: var(--tc-size); height: var(--tc-size); }
    #touch-controls .tc-hub { display: block; }
    #touch-controls .tc-action-wrap {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
    }
    #touch-controls .tc-menu-wrap {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      top: max(8px, env(safe-area-inset-top));
    }
    #touch-controls .tc-btn {
      pointer-events: auto;
      width: var(--tc-size);
      height: var(--tc-size);
      min-width: 44px;
      min-height: 44px;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid rgba(246, 231, 193, 0.5);
      background: rgba(26, 16, 32, 0.48);
      color: #f6e7c1;
      font: 600 16px system-ui, sans-serif;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }
    #touch-controls .tc-action-wrap .tc-btn {
      width: clamp(60px, 15vmin, 68px);
      height: clamp(60px, 15vmin, 68px);
      min-width: 60px;
      min-height: 60px;
      border-radius: 50%;
      font-size: 12px;
      background: rgba(90, 58, 106, 0.62);
    }
    #touch-controls .tc-menu-wrap .tc-btn {
      width: 54px;
      height: 44px;
      min-height: 44px;
      font-size: 10px;
      border-radius: 12px;
    }
    #touch-controls .tc-btn.tc-active {
      background: rgba(232, 200, 74, 0.82);
      color: #1a1020;
      transform: scale(0.96);
    }
    .orientation-notice {
      position: fixed;
      z-index: 20;
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      max-width: 340px;
      margin: 0 auto;
      padding: 14px 18px;
      border: 1px solid rgba(196, 165, 116, 0.55);
      border-radius: 14px;
      background: rgba(26, 16, 32, 0.88);
      color: #f6e7c1;
      font: 600 14px/1.45 system-ui, sans-serif;
      text-align: left;
      pointer-events: none;
      box-shadow: 0 10px 36px rgba(0,0,0,0.35);
    }
    .orientation-notice[hidden] { display: none !important; }
    .orientation-notice .orientation-icon {
      flex: 0 0 auto;
      font-size: 30px;
      color: #e8c84a;
      line-height: 1;
    }
    @media (max-height: 360px) and (orientation: landscape) {
      :root { --tc-size: 44px; --tc-gap: 2px; }
      #touch-controls .tc-action-wrap .tc-btn { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>
  <script type="module" src="./src/main.js?v=preb15-1"></script>
</body>
</html>
